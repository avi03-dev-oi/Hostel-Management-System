<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enter Your details.</title>
    <style>
        .modal {
            display: none; /* Hide the modal by default */
            position: fixed;
            z-index: 1;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            overflow: auto;
            background-color: rgba(0, 0, 0, 0.5); /* Semi-transparent black background */
        }

        .modal-content {
            background-color: #fefefe;
            margin: 15% auto;
            padding: 20px;
            border: 1px solid #888;
            width: 80%;
            text-align: center;
        }

        button {
            margin: 5px;
            border: none;
            background: none;
            cursor: pointer;
        }

        button img {
            width: 50px; /* Adjust the size of the images */
            height: 50px; /* Adjust the size of the images */
            padding: 10px; /* Add padding */
            filter: grayscale(100%) brightness(100%) contrast(100%) invert(100%);
        }

        button span {
            font-family: Arial, sans-serif;
            font-size: 16px;
            font-weight: bold;
        }

        button:hover img {
            transform: scale(1.1); /* Scale the image on hover */
            filter: none;
        }
        #manButton:hover{
            border: 3px solid skyblue;
            border-radius: 2cap;
            color: skyblue;
        }
        #womanButton:hover{
            border: 3px solid rgb(252, 76, 217);
            border-radius: 2cap;
            color: rgb(252, 76, 217);
        }
    </style>
</head>
<body>
<div id="confirmationModal" class="modal">
  <div class="modal-content">
    <p>Are you 18 years or older?</p>
    <button id="yesButton">Yes</button>
    <button id="noButton">No</button>
  </div>
</div>

<div id="genderModal" class="modal">
  <div class="modal-content">
    <p>Select your gender:</p>
    <button id="manButton"><img src="./man-toilet-color-icon.png"><br><span>Male</span></button>
    <button id="womanButton"><img src="./women-toilet-color-icon.png"><br><span>Female</span></button>
  </div>
</div>

<script>
    var confirmationModal = document.getElementById("confirmationModal");
    var genderModal = document.getElementById("genderModal");
    var yesButton = document.getElementById("yesButton");
    var noButton = document.getElementById("noButton");
    var manButton = document.getElementById("manButton");
    var womanButton = document.getElementById("womanButton");

    confirmationModal.style.display = "block";

    yesButton.onclick = function() {
        confirmationModal.style.display = "none";
        genderModal.style.display = "block";
    };

    noButton.onclick = function() {
        window.location.href = "home.php"; 
    };

    manButton.onclick = function() {
        window.location.href = "Male.html"; 
    };

    womanButton.onclick = function() {
        window.location.href = "Female.php"; 
    };
    window.addEventListener('beforeunload', function(event) {
        window.location.href = "home.php";
    });
</script>
</body>
</html>
